name: CI & Deploy Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain & wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (host)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build WASM release
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Verify JS syntax and assemble site bundle
        run: |
          node --check web/app.js
          cp target/wasm32-unknown-unknown/release/pixel_alchemy.wasm web/pixel_alchemy.wasm
          ls -lh web/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
